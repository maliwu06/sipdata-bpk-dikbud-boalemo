<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIPDATA BPK BOALEMO</title>
    <style>
        /* Menghilangkan margin browser agar aplikasi tampil fullscreen */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #0b0f19; /* Warna latar belakang gelap bawaan aplikasi Anda */
        }
        /* Mengatur iframe agar borderless dan responsif penuh */
        iframe {
            border: none;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <!-- Link Web App Google Apps Script Anda yang dibungkus secara utuh -->
    <iframe src="https://google.com"></iframe>

</body>
</html>
