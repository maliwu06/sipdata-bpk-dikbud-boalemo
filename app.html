<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Aplikasi - SIPDATA BPK</title>
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Mencegah scroll ganda */
            background-color: #060b17; /* Sesuai tema warna dasar bpk-dark */
        }

        /* Container iframe untuk mengatur posisi */
        .iframe-container {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        /* Trik iFrame: Menggeser sedikit ke atas (top: -30px) untuk mencoba menyembunyikan banner Google jika memungkinkan secara visual, sambil tetap responsif */
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        
        /* Loading Screen sementara iFrame dimuat */
        .loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #060b17;
            color: #10b981;
            z-index: 10;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: opacity 0.5s ease;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(16, 185, 129, 0.2);
            border-top: 4px solid #10b981;
            border-radius: 50%;
